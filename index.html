<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#09090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DONT"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>DONT — НЕ НАЖИМАЙ</title>
<style>
:root{color-scheme:dark;--bg:#09090c;--panel:#15151b;--red:#ef233c;--muted:#92929e;--white:#f5f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#1b1015 0,#09090c 55%);color:var(--white);font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:flex;justify-content:center}.app{width:min(100%,520px);padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}.brand{font-weight:900;letter-spacing:.28em;font-size:15px;color:#aaa;margin:8px 0 28px}.score{font-size:clamp(64px,18vw,94px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.caption{color:var(--muted);font-size:14px;letter-spacing:.14em;margin-top:8px}.button-wrap{margin:42px 0 28px;width:min(76vw,310px);aspect-ratio:1;display:grid;place-items:center}.dont{width:100%;height:100%;border:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff5668,#d90429 65%,#8d0018);color:white;font-size:clamp(24px,7vw,36px);font-weight:1000;line-height:1.05;box-shadow:0 14px 0 #680014,0 24px 55px #e0003540,inset 0 5px 12px #ffffff50;touch-action:manipulation;transition:transform .07s,filter .1s}.dont:active{transform:translateY(9px);box-shadow:0 5px 0 #680014,0 12px 25px #e0003530}.message{min-height:28px;text-align:center;color:#ff9aa6;font-weight:650;margin-bottom:26px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.stat,.shop{background:var(--panel);border:1px solid #292932;border-radius:17px;padding:15px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:21px}.shop{width:100%;margin-top:12px}.shop h2{font-size:16px;margin:0 0 12px}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #30303a}.upgrade p{margin:0;font-size:14px}.upgrade small{color:var(--muted)}button.secondary{background:#282831;border:1px solid #393943;color:white;border-radius:12px;padding:10px 13px;font-weight:750}.actions{display:flex;gap:10px;width:100%;margin-top:12px}.actions button{flex:1}.footer{color:#666673;font-size:11px;margin-top:22px;text-align:center}
</style></head><body><main class="app"><div class="brand">DONT / НЕ НАЖИМАЙ</div><div class="score" id="score">0</div><div class="caption">РАЗ ТЫ УЖЕ ЗДЕСЬ — НЕ ОСТАНАВЛИВАЙСЯ</div><div class="button-wrap"><button class="dont" id="tap" aria-label="Не нажимай">НЕ<br>НАЖИМАЙ</button></div><div class="message" id="message">Ты точно хочешь это сделать?</div><section class="stats"><div class="stat"><small>МОНЕТЫ</small><b id="coins">0</b></div><div class="stat"><small>СИЛА КЛИКА</small><b id="power">1</b></div></section><section class="shop"><h2>УЛУЧШЕНИЯ</h2><div class="upgrade"><div><p>Сильнее палец</p><small>+1 монета за нажатие · цена <span id="powerCost">25</span></small></div><button class="secondary" id="buyPower">Купить</button></div><div class="upgrade"><div><p>Автокликер</p><small>+1 клик/сек · цена <span id="autoCost">100</span></small></div><button class="secondary" id="buyAuto">Купить</button></div></section><div class="actions"><button class="secondary" id="share">Поделиться</button><button class="secondary" id="reset">Сбросить</button></div><div class="footer">DONT — маленькая игра с большой кнопкой. Прогресс хранится на этом устройстве.</div></main>
<script>
(()=>{const $=id=>document.getElementById(id);let s={clicks:0,coins:0,power:1,auto:0};try{s={...s,...JSON.parse(localStorage.getItem('dont-save')||'{}')}}catch{}const lines=[[0,'Ты точно хочешь это сделать?'],[10,'Я же просил.'],[50,'У тебя проблемы с самоконтролем?'],[100,'Это уже становится странным.'],[250,'Кнопка тобой управляет.'],[500,'Ты мог бы остановиться.'],[1000,'ЛЕГЕНДА. Но зачем?']];function save(){localStorage.setItem('dont-save',JSON.stringify(s));render()}function render(){$('score').textContent=s.clicks.toLocaleString('ru-RU');$('coins').textContent=s.coins.toLocaleString('ru-RU');$('power').textContent=s.power;$('powerCost').textContent=25*s.power;$('autoCost').textContent=100*(s.auto+1);let line=lines[0][1];for(const [n,t] of lines)if(s.clicks>=n)line=t;$('message').textContent=line+(s.auto?' · Автокликер: '+s.auto+'/сек':'')}$('tap').addEventListener('click',()=>{s.clicks++;s.coins+=s.power;save()});$('buyPower').onclick=()=>{let c=25*s.power;if(s.coins>=c){s.coins-=c;s.power++;save()}else $('message').textContent='Не хватает монет. Нажимай ещё.'};$('buyAuto').onclick=()=>{let c=100*(s.auto+1);if(s.coins>=c){s.coins-=c;s.auto++;save()}else $('message').textContent='Не хватает монет. Нажимай ещё.'};setInterval(()=>{if(s.auto){s.clicks+=s.auto;s.coins+=s.auto*s.power;save()}},1000);$('share').onclick=async()=>{let t=`Я нажал кнопку DONT ${s.clicks} раз. А ты сможешь остановиться?`;try{if(navigator.share)await navigator.share({title:'DONT',text:t});else{await navigator.clipboard.writeText(t);$('message').textContent='Результат скопирован!'}}catch{}};$('reset').onclick=()=>{if(confirm('Сбросить весь прогресс?')){s={clicks:0,coins:0,power:1,auto:0};save()}};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
